<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FF6B6B" />
  <title>オフライン - エムシースクエア</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Sans JP', sans-serif; background: #FFF5F0; color: #2D3436; text-align: center; padding: 1rem; box-sizing: border-box; }
    img { width: 120px; height: 120px; border-radius: 24px; }
    h1 { font-size: 1.3rem; margin: 1.5rem 0 .5rem; }
    p { color: #636E72; margin: 0 0 1.5rem; }

  </style>
</head>
<body>
  <main>
    <img src="/logo192.png" alt="MC Square" />
    <h1>インターネットに接続されていません</h1>
    <p>接続を確認してから、もう一度お試しください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </main>
</body>
</html>
