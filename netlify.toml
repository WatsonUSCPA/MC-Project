# Netlifyの基本的なビルド設定
[build]
  # ビルドコマンド
  command = "cd mc-square-react && npm install && npm run build"
  # Reactアプリのビルドディレクトリ
  publish = "mc-square-react/build"
  # Netlify Functionsの場所
  functions = "netlify/functions"

# これが依存関係をインストールするための重要なプラグインです
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Node.jsのバージョンを指定
[build.environment]
  NODE_VERSION = "18"
  CI = "false"

# React Router用のリダイレクト設定（SPA対応）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API用のリダイレクト設定
[[redirects]]
  # /api/ へのアクセスを、
  from = "/api/*"
  # Netlify Functionsに繋ぎます
  to = "/.netlify/functions/:splat"
  # ステータスコード200は「成功」を意味します
  status = 200 

# 管理者リンクページを検索エンジンに載せない
[[headers]]
  for = "/admin_links.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Referrer-Policy（YouTube の埋め込みに必要。no-referrer にしない）
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

# PWA: Service Worker と manifest は常に最新を取得させる
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
